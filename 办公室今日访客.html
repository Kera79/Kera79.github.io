<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博士办公室 - 今日访客</title>
  <style>
    :root {
      --bg-color: #121826;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #e0e6ed;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0e14;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    .game-container {
      width: 100%;
      max-width: 414px;
      height: 844px;
      background: linear-gradient(180deg, #182032 0%, #0d121d 100%);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .header-bar {
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      z-index: 10;
    }

    .title-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .currency-container {
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .coin-icon {
      width: 18px;
      height: 18px;
      background: #8a99ad;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #121826;
    }

    .content-area {
      flex: 1;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .page {
      display: none;
      flex-direction: column;
      gap: 15px;
      height: 100%;
    }

    .page.active {
      display: flex;
    }

    #page-shop {
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      margin: -20px;
      padding: 20px;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden !important;
      max-height: none !important;
    }

    #page-shop > * {
      position: relative;
      z-index: 1;
    }

    #page-gallery {
      justify-content: flex-start !important;
      overflow-y: auto !important;
    }

    .section-title {
      text-align: center;
      font-size: 20px;
      color: #b0c4de;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(6px);
    }

    #page-shop .card {
      background: #ffffff !important;
      color: #121826 !important;
      opacity: 1 !important;
      backdrop-filter: none !important;
      border: 1px solid #cbd5e1 !important;
    }

    #page-shop .card span {
      color: #334155 !important;
    }

    #page-shop .card .shop-item-icon {
      background: #f1f5f9 !important;
    }

    .card.locked-card {
      opacity: 0.5;
    }

    .char-card-selected {
      border: 1px solid #3b82f6;
      background: rgba(59, 130, 246, 0.1);
    }

    .visitor-avatar {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      background: #2a3547;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      margin-top: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .select-btn {
      padding: 6px 12px;
      font-size: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .select-btn.active {
      background: #10b981;
    }

    .select-btn:disabled {
      background: rgba(255,255,255,0.1);
      color: #64748b;
      cursor: not-allowed;
    }

    .navbar {
      height: 70px;
      background: rgba(10, 14, 22, 0.95);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .nav-btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      color: var(--text-sub);
      font-size: 14px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      margin: 0 5px;
    }

    .shop-item-icon {
      width: 45px;
      height: 45px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .buy-btn {
      background: #2563eb;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .buy-btn:hover { background: #1d4ed8; }
    .buy-btn:disabled { background: #94a3b8; opacity: 0.6; cursor: not-allowed; }

    #interaction-screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: transparent;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      z-index: 100;
      transition: background-image 0.3s ease-in-out;
    }

    .top-control-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      z-index: 10;
    }

    .back-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .bedroom-btn {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(8px);
      white-space: nowrap;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .status-header {
      flex: 1;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      background: rgba(0,0,0,0.5);
      padding: 8px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .status-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-title-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #cbd5e1;
    }

    .progress-bar-bg {
      height: 5px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .main-interactive-area {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      z-index: 10;
    }

    .left-items-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.3s ease;
    }

    .item-slot {
      width: 58px;
      height: 58px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      position: relative;
    }
    .item-slot:active {
      transform: scale(0.95);
    }

    .item-slot.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .item-slot-name {
      font-size: 8px;
      color: #94a3b8;
      margin-top: 1px;
    }

    .item-slot-rate {
      font-size: 8px;
      color: #38bdf8;
      font-weight: bold;
    }

    .right-actions-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.3s ease;
    }

    .action-choice-btn {
      width: 90px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: opacity 0.3s ease, background 0.2s;
    }
    .action-choice-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .disabled-controls {
      opacity: 0.35;
      pointer-events: none;
    }

    .dialogue-box {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 15px;
      min-height: 95px;
      backdrop-filter: blur(10px);
      z-index: 10;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .dialogue-box.disabled-dialogue {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .speaker-name {
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .state-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      color: #38bdf8;
    }

    .dialogue-text {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .tips-banner {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #93c5fd;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

<div class="game-container">

  <div class="header-bar">
    <div class="title-text" id="header-title">博士办公室</div>
    <div class="currency-container">
      <div class="coin-icon">C</div>
      <span id="coin-count">250</span>
    </div>
  </div>

  <div class="content-area">
    <div id="page-visitor" class="page active">
      <div class="section-title">召集干员</div>
      
      <div class="tips-banner">
        <span>💡</span>
        <span><strong>小提示：</strong>干员对你产生怀疑时，记得要及时选择“否认”来降低怀疑度哦！</span>
      </div>

      <div id="character-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
      <button class="action-btn" onclick="startInteraction()" style="margin-top: 15px;">呼叫干员进入办公室</button>
    </div>

    <div id="page-config" class="page">
      <div class="section-title">装备配置</div>
      <div id="equipped-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <div id="page-shop" class="page">
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; width: 100%;">
        <div class="section-title" style="color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">疗养院小店</div>
        <div id="shop-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
    </div>

    <!-- 档案页面：只保留干员档案列表，完全去除了小店内容 -->
    <div id="page-gallery" class="page">
      <div class="section-title">干员档案</div>
      <div id="gallery-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-btn active" onclick="switchTab('visitor', this)">召集</div>
    <div class="nav-btn" onclick="switchTab('config', this)">配置</div>
    <div class="nav-btn" onclick="switchTab('shop', this)">小店</div>
    <div class="nav-btn" onclick="switchTab('gallery', this)">档案</div>
  </div>

  <div id="interaction-screen">
    <div class="top-control-bar">
      <button class="back-btn" onclick="exitInteraction()">◀ 离开办公室</button>
      
      <div class="status-header">
        <div class="status-box">
          <div class="status-title-row">
            <span>睡意</span>
            <span id="val-sleepiness">0/200</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="bar-sleepiness" style="background: #3b82f6;"></div>
          </div>
        </div>
        <div class="status-box">
          <div class="status-title-row">
            <span>怀疑</span>
            <span id="val-suspicion">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="bar-suspicion" style="background: #ef4444;"></div>
          </div>
        </div>
        <div class="status-box">
          <div class="status-title-row">
            <span>信赖</span>
            <span id="val-favor">90%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="bar-favor" style="width: 90%; background: #ec4899;"></div>
          </div>
        </div>
      </div>

      <button class="bedroom-btn" id="bedroom-btn-el" style="display: none;" onclick="moveToBedroom()">🌙 搬回卧室</button>
    </div>

    <div class="main-interactive-area" id="main-interactive-area-el">
      <div class="left-items-column" id="quick-items-bar"></div>

      <div class="right-actions-column" id="right-actions-bar">
        <div class="action-choice-btn" onclick="handleDialogue('affirm')">
          <span>☑</span> 赞同
        </div>
        <div class="action-choice-btn" onclick="handleDialogue('deny')">
          <span>☒</span> 否认
        </div>
        <div class="action-choice-btn" onclick="handleDialogue('tease')">
          <span>☺</span> 打趣
        </div>
        <div class="action-choice-btn" onclick="handleDialogue('topic')">
          <span>💬</span> 聊工作
        </div>
      </div>
    </div>

    <div class="dialogue-box" id="dialogue-box-el" onclick="triggerSleepStageDialogue()">
      <div class="speaker-name">
        <span id="speaker-name-display">角色名称</span>
        <span class="state-badge" id="speaker-status-badge">普通</span>
      </div>
      <div class="dialogue-text" id="dialogue-text">……</div>
    </div>
  </div>

</div>

<script>
  const MAX_SLEEPINESS = 200;
  const COOL_DOWN_TIME = 4000;
  const SHOP_BG_PATH = "images/shop_bg.png";
  const FAIL_CG_PATH = "images/fail_cg.png";

  const IMAGE_CONFIG = {
    1: {
      avatar: "images/char_1_avatar.png",
      stages: { normal: "images/char_1_bg_normal.png", light: "images/char_1_bg_light.png", heavy: "images/char_1_bg_heavy.png", asleep: "images/char_1_bg_asleep.png" },
      suspicion: { low: "images/char_1_sus_low.png", high: "images/char_1_sus_high.png" },
      items: { 1: "images/char_1_use_item_1.png", 2: "images/char_1_use_item_2.png", 3: "images/char_1_use_item_3.png" },
      itemFails: { 1: "images/char_1_fail_item_1.png", 2: "images/char_1_fail_item_2.png", 3: "images/char_1_fail_item_3.png" },
      actions: { affirm: "images/char_1_act_affirm.png", deny: "images/char_1_act_deny.png", tease: "images/char_1_act_tease.png", topic: "images/char_1_act_topic.png" }
    },
    2: {
      avatar: "images/char_2_avatar.png",
      stages: { normal: "images/char_2_bg_normal.png", light: "images/char_2_bg_light.png", heavy: "images/char_2_bg_heavy.png", asleep: "images/char_2_bg_asleep.png" },
      suspicion: { low: "images/char_2_sus_low.png", high: "images/char_2_sus_high.png" },
      items: { 1: "images/char_2_use_item_1.png", 2: "images/char_2_use_item_2.png", 3: "images/char_2_use_item_3.png" },
      itemFails: { 1: "images/char_2_fail_item_1.png", 2: "images/char_2_fail_item_2.png", 3: "images/char_2_fail_item_3.png" },
      actions: { affirm: "images/char_2_act_affirm.png", deny: "images/char_2_act_deny.png", tease: "images/char_2_act_tease.png", topic: "images/char_2_act_topic.png" }
    },
    3: {
      avatar: "images/char_3_avatar.png",
      stages: { normal: "images/char_3_bg_normal.png", light: "images/char_3_bg_light.png", heavy: "images/char_3_bg_heavy.png", asleep: "images/char_3_bg_asleep.png" },
      suspicion: { low: "images/char_3_sus_low.png", high: "images/char_3_sus_high.png" },
      items: { 1: "images/char_3_use_item_1.png", 2: "images/char_3_use_item_2.png", 3: "images/char_3_use_item_3.png" },
      itemFails: { 1: "images/char_3_fail_item_1.png", 2: "images/char_3_fail_item_2.png", 3: "images/char_3_fail_item_3.png" },
      actions: { affirm: "images/char_3_act_affirm.png", deny: "images/char_3_act_deny.png", tease: "images/char_3_act_tease.png", topic: "images/char_3_act_topic.png" }
    }
  };

  let coins = 250;
  const inventory = [1];

  let sleepinessVal = 0;
  let suspicionVal = 0;
  let favorVal = 90;
  let isRewardClaimed = false;
  let isSuspiciousNow = false;

  let isShowingTempBg = false;
  let tempBgTimer = null;
  let isCoolingDown = false;
  let coolDownTimer = null;

  let lastEvent = null;

  let activeSleepinessBuff = 0;
  const stageHierarchy = ['asleep', 'heavy', 'light', 'normal'];

  const characters = [
    { 
      id: 1, name: "煌", avatarIcon: "🐺", desc: "精英干员。收到通知后来到了你的办公室。", locked: false,
      initialSleepiness: 0, initialSuspicion: 0, initialFavor: 90,
      asleepQuotes: [ "……呼咔——……噗哈……呼噜噜……", "（趴在沙发扶头上发出均匀豪爽的鼾声）", "……唔……冰镇啤酒……别跑……" ],
      itemQuotes: [ "那边有什么东西？我怎么没看见？……", "嗯？蝴蝶？哪里有蝴蝶？……" ],
      itemFailQuotes: [ "等一下博士，你刚才手里拿的是什么？", "嗯？你动作怎么慌慌张张的？", "博士，你是不是想整蛊我？", "“这点小把戏可放不倒我，博士你在干嘛呢？”" ],
      suspicionFailQuotes: [ "博士,你这眼神……根本就是在打什么坏主意吧！", "别想转移话题，你刚才的动作太可疑了！" ],
      sleepStageQuotes: {
        normal: [ "哟，博士！突然把我喊到办公室来有什么事？", "说吧博士，这次又需要我破开哪扇墙？", "办公室的沙发坐着真挺舒服的，博士你平时都在这里休息？" ],
        light: [ "哈啊……今天在训练室折腾太久了……博士你刚才 said 找我什么事来着？", "唔，脑袋有点沉……博士，你办公室有热茶吗？", "感觉眼皮有点打架……不过没关系，我还能坚持！" ],
        heavy: [ "…呼……我只是在沙发上……靠着眯一会……", "博士……你的声音听起来……越来越远了……呼……", "怎么突然这么困...奇怪……" ]
      },
      suspiciousQuotes: [ "……博士，你眼神看起来有点奇怪啊，是不是隐瞒了我什么事？", "嗯？你说话声音怎么怪怪的……你在打什么鬼主意？", "等会，你刚才手背在后面偷偷摸摸拿着什么呢？" ],
      actions: {
        affirm: {

  let selectedCharId = 1;

  function calculateItemSuccessRate(itemId) {
    if (itemId === 2) return 100;
    let rate = 50 + (favorVal * 0.5) - suspicionVal + (sleepinessVal * 0.5);
    return Math.max(0, Math.min(100, Math.round(rate)));
  }

  function getRandomElement(arr) {
    if (!arr || arr.length === 0) return "";
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function tryLoadImage(url, callback) {
    if (!url) { callback(false); return; }
    const img = new Image();
    img.onload = () => callback(true, url);
    img.onerror = () => callback(false, null);
    img.src = url;
  }

  function getSleepStage() {
    if (sleepinessVal >= 200) return 'asleep';
    if (sleepinessVal < 100) return 'normal';
    if (sleepinessVal < 160) return 'light';
    return 'heavy';
  }

  function getSleepStageBadgeText(stage) {
    if (sleepinessVal >= 200) return '沉睡';
    if (sleepinessVal >= 160) return '重度';
    if (sleepinessVal >= 100) return '轻度';
    return '普通';
  }

  function renderCharacterList() {
    const container = document.getElementById('character-list');
    const galleryContainer = document.getElementById('gallery-list');
    container.innerHTML = '';
    galleryContainer.innerHTML = '';

    characters.forEach(char => {
      const isSelected = char.id === selectedCharId;
      const avatarPath = IMAGE_CONFIG[char.id] ? IMAGE_CONFIG[char.id].avatar : null;
      
      const card = document.createElement('div');
      card.className = `card ${isSelected ? 'char-card-selected' : ''} ${char.locked ? 'locked-card' : ''}`;
      
      const avatarDivId = `avatar-el-${char.id}`;
      card.innerHTML = `
        <div class="visitor-avatar" id="${avatarDivId}">${char.avatarIcon}</div>
        <div style="flex: 1;">
          <div style="font-weight: bold; font-size: 16px;">${char.name} ${char.locked ? '<span style="font-size:12px; color:#ef4444;">[未开放]</span>' : ''}</div>
          <div style="font-size: 11px; color: var(--text-sub); margin-top: 4px;">${char.desc}</div>
          <div style="font-size: 10px; color: #38bdf8; margin-top: 2px;">
            初始: 睡意${char.initialSleepiness} | 怀疑${char.initialSuspicion}% | 信赖${char.initialFavor}%
          </div>
        </div>
        <button class="select-btn ${isSelected ? 'active' : ''}" ${char.locked ? 'disabled' : ''} onclick="selectCharacter(${char.id})">
          ${char.locked ? '锁定' : (isSelected ? '已选择' : '召集')}
        </button>
      `;
      container.appendChild(card);

      const gCard = document.createElement('div');
      gCard.className = `card ${char.locked ? 'locked-card' : ''}`;
      const gAvatarId = `g-avatar-el-${char.id}`;
      gCard.innerHTML = `
        <div class="visitor-avatar" id="${gAvatarId}">${char.avatarIcon}</div>
        <div>
          <div style="font-weight: bold;">${char.name} ${char.locked ? '<span style="font-size:12px; color:#ef4444;">[未开放]</span>' : ''}</div>
          <div style="font-size: 12px; color: var(--text-sub); margin-top: 2px;">${char.desc}</div>
        </div>
      `;
      galleryContainer.appendChild(gCard);

      tryLoadImage(avatarPath, (success, path) => {
        if (success) {
          const el1 = document.getElementById(avatarDivId);
          const el2 = document.getElementById(gAvatarId);
          if (el1) { el1.style.backgroundImage = `url('${path}')`; el1.innerText = ''; }
          if (el2) { el2.style.backgroundImage = `url('${path}')`; el2.innerText = ''; }
        }
      });
    });
  }

  function selectCharacter(id) {
    const char = characters.find(c => c.id === id);
    if (char && char.locked) return;
    selectedCharId = id;
    renderCharacterList();
  }

  const shopItems = [
    { id: 1, icon: '🧪', name: '安眠药', text: '后续每次交互额外+10睡意', price: 0, tickAdd: 10, suspAdd: 10 },

  // 修改点：调整 switchTab 逻辑，点击 gallery 时确保只属于档案页面，不污染背景和小店
  function switchTab(tabName, btnElement) {
    document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`page-${tabName}`).classList.add('active');
    btnElement.classList.add('active');
    
    const shopPage = document.getElementById('page-shop');
    if (tabName === 'shop') {
      tryLoadImage(SHOP_BG_PATH, (success, path) => {
        if (success) {
          shopPage.style.backgroundImage = `url('${path}')`;
        }
      });
      renderShop();
    } else {
      shopPage.style.backgroundImage = 'none';
      if (tabName === 'config') {
        renderConfig();
      } else if (tabName === 'gallery') {
        // 确保点击档案时重新渲染档案列表，不掺杂任何小店元素
        renderCharacterList();
      }
    }
  }

  function renderShop() {
    const container = document.getElementById('shop-list');
    container.innerHTML = '';
    shopItems.forEach(item => {
      const isBought = inventory.includes(item.id);
      const canAfford = coins >= item.price;
      const currentDynamicRate = calculateItemSuccessRate(item.id);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="shop-item-icon">${item.icon}</div>
        <div style="flex: 1; font-size: 13px; color: #121826;">${item.name} <span style="font-size:11px; color:#2563eb;">(${currentDynamicRate}%)</span><br><span style="font-size:11px; color:#64748b;">${item.text}</span></div>
        <button class="buy-btn" ${isBought || !canAfford ? 'disabled' : ''} onclick="buyItem(${item.id})">
          ${isBought ? '已解锁' : `C ${item.price}`}
        </button>
      `;
      container.appendChild(card);
    });
  }

  function buyItem(id) {
    const item = shopItems.find(i => i.id === id);
    if (item && !inventory.includes(id) && coins >= item.price) {
      coins -= item.price;
      inventory.push(id);
      document.getElementById('coin-count').innerText = coins;
      renderShop();
      renderConfig();
      renderQuickItemsBar();
    }
  }

  function renderConfig() {
    const container = document.getElementById('equipped-list');
    if (inventory.length === 0) {
      container.innerHTML = `<div style="color: var(--text-sub); text-align: center; margin-top: 30px;">未配置任何辅助道具</div>`;
      return;
    }
    container.innerHTML = '';
    inventory.forEach(id => {
      const item = shopItems.find(x => x.id === id);
      const currentDynamicRate = calculateItemSuccessRate(item.id);
      container.innerHTML += `
        <div class="card">
          <div class="shop-item-icon">${item.icon}</div>
          <div style="font-size: 13px; color: #16a34a;">[已解锁] ${item.name} <span style="font-size:11px; color:#2563eb;">(${currentDynamicRate}%成功率)</span></div>
        </div>
      `;
    });
  }

  function refreshDialogueTextForCurrentEvent() {
    if (suspicionVal >= 100) return;

    const char = characters.find(c => c.id === selectedCharId);
    if (!char) return;

    const currentStage = getSleepStage();

    if (currentStage === 'asleep') {
      document.getElementById('dialogue-text').innerText = getRandomAsleepQuote(char);
      return;
    }

    if (!lastEvent) {
      if (isSuspiciousNow) {
        document.getElementById('dialogue-text').innerText = getRandomElement(char.suspiciousQuotes);
      } else {
        const quotesList = (sleepinessVal > 130 && char.sleepStageQuotes['heavy']) ? char.sleepStageQuotes['heavy'] : (char.sleepStageQuotes[currentStage] || char.sleepStageQuotes['normal']);
        document.getElementById('dialogue-text').innerText = getRandomElement(quotesList);
      }
      return;
    }

    let nextText = "";

    if (lastEvent.type === 'item') {
      if (lastEvent.success) {
        nextText = getRandomElement(char.itemQuotes || ["……"]);
      } else {
        nextText = getRandomElement(char.itemFailQuotes || ["……？"]);
      }
    } else if (lastEvent.type === 'action') {
      const actType = lastEvent.detail;
      if (isSuspiciousNow && actType !== 'deny') {
        const susFailQuotes = char.suspicionFailQuotes;
        nextText = Array.isArray(susFailQuotes) ? getRandomElement(susFailQuotes) : "……？";
      } else {
        const stageActionQuotes = (sleepinessVal > 130 && char.actions[actType]['heavy']) ? char.actions[actType]['heavy'] : (char.actions[actType][currentStage] || char.actions[actType]['normal']);
        nextText = Array.isArray(stageActionQuotes) ? getRandomElement(stageActionQuotes) : stageActionQuotes;
      }
    } else if (lastEvent.type === 'dialogue') {
      if (isSuspiciousNow) {
        nextText = getRandomElement(char.suspiciousQuotes);
      } else {
        const quotesList = (sleepinessVal > 130 && char.sleepStageQuotes['heavy']) ? char.sleepStageQuotes['heavy'] : (char.sleepStageQuotes[currentStage] || char.sleepStageQuotes['normal']);
        nextText = getRandomElement(quotesList);
      }
    }

    if (nextText) {
      document.getElementById('dialogue-text').innerText = nextText;
    }
  }

  function triggerCoolDown() {
    if (suspicionVal >= 100) return;
    isCoolingDown = true;
    if (coolDownTimer) clearTimeout(coolDownTimer);

    document.getElementById('quick-items-bar').classList.add('disabled-controls');
    document.getElementById('right-actions-bar').classList.add('disabled-controls');
    document.getElementById('dialogue-box-el').classList.add('disabled-dialogue');

    coolDownTimer = setTimeout(() => {
      isCoolingDown = false;
      document.getElementById('quick-items-bar').classList.remove('disabled-controls');
      document.getElementById('right-actions-bar').classList.remove('disabled-controls');
      document.getElementById('dialogue-box-el').classList.remove('disabled-dialogue');

      refreshDialogueTextForCurrentEvent();
    }, COOL_DOWN_TIME);
  }

  function startInteraction() {
    const char = characters.find(c => c.id === selectedCharId);
    if (!char || char.locked) return;

    sleepinessVal = char.initialSleepiness || 0;
    suspicionVal = char.initialSuspicion || 0;
    favorVal = char.initialFavor || 90;
    
    isRewardClaimed = false;
    activeSleepinessBuff = 0;
    isSuspiciousNow = false;
    isCoolingDown = false;
    lastEvent = null;
    
    resetTempBgState();
    
    document.getElementById('main-interactive-area-el').style.display = 'flex';
    document.getElementById('dialogue-box-el').style.display = 'block';

    checkSuspicionTrigger();
    updateStatusDisplay();

    document.getElementById('speaker-name-display').innerText = char.name;

    renderQuickItemsBar();

    triggerSleepStageDialogue(true);
    document.getElementById('interaction-screen').style.display = 'flex';
  }

  function renderQuickItemsBar() {
    const quickBar = document.getElementById('quick-items-bar');
    quickBar.innerHTML = '';

    shopItems.forEach(item => {
      const isUnlocked = inventory.includes(item.id);
      const currentDynamicRate = calculateItemSuccessRate(item.id);
      if (isUnlocked) {
        quickBar.innerHTML += `
          <div class="item-slot" onclick="useItem(${item.id})">
            <span>${item.icon}</span>
            <span class="item-slot-name">${item.name}</span>
            <span class="item-slot-rate">${currentDynamicRate}%</span>
          </div>
        `;
      } else {
        quickBar.innerHTML += `
          <div class="item-slot locked" title="需在疗养院小店解锁">
            <span>🔒</span>
            <span class="item-slot-name">${item.name}</span>
          </div>
        `;
      }
    });
  }

  function checkSuspicionTrigger() {
    if (sleepinessVal >= 100 || getSleepStage() === 'asleep') {
      isSuspiciousNow = false;
      return;
    }
    const rand = Math.random() * 100;
    isSuspiciousNow = rand < suspicionVal;
  }

  function updateBackgroundForStage(stage) {
    if (suspicionVal >= 100) return;

    const charId = selectedCharId;
    const charConfig = IMAGE_CONFIG[charId];
    if (!charConfig) return;

    const screen = document.getElementById('interaction-screen');

    if (isSuspiciousNow && stage !== 'asleep') {
      const susType = suspicionVal < 50 ? 'low' : 'high';
      const susBgPath = charConfig.suspicion ? charConfig.suspicion[susType] : null;

      tryLoadImage(susBgPath, (success, path) => {
        if (success) {
          screen.style.backgroundImage = `url('${path}')`;
        } else {
          fallbackNormalStageBg();
        }
      });
      return;
    }

    fallbackNormalStageBg();

    function fallbackNormalStageBg() {
      if (!charConfig.stages) return;
      const startIndex = stageHierarchy.indexOf(stage);
      const candidateStages = stageHierarchy.slice(startIndex >= 0 ? startIndex : 0);

      function checkAndApplyStageBg(index) {
        if (index >= candidateStages.length) {
          screen.style.backgroundImage = 'none';
          return;
        }

        const st = candidateStages[index];
        const targetBg = charConfig.stages[st];

        tryLoadImage(targetBg, (success, path) => {
          if (success) {
            screen.style.backgroundImage = `url('${path}')`;
          } else {
            checkAndApplyStageBg(index + 1);
          }
        });
      }

      checkAndApplyStageBg(0);
    }
  }

  function triggerTempBgAnimation(bgPath, duration = 3000) {
    if (suspicionVal >= 100) return;
    if (!bgPath) return;

    if (tempBgTimer) {
      clearTimeout(tempBgTimer);
      tempBgTimer = null;
    }

    const screen = document.getElementById('interaction-screen');

    tryLoadImage(bgPath, (success, path) => {
      if (success) {
        screen.style.backgroundImage = `url('${path}')`;
        isShowingTempBg = true;

        tempBgTimer = setTimeout(() => {
          isShowingTempBg = false;
          tempBgTimer = null;
          updateStatusDisplay();
        }, duration);
      } else {
        isShowingTempBg = false;
        updateBackgroundForStage(getSleepStage());
      }
    });
  }

  function triggerItemAnimation(itemId) {
    const charId = selectedCharId;
    const charConfig = IMAGE_CONFIG[charId];
    if (!charConfig || !charConfig.items) return;

    const itemBgPath = charConfig.items[itemId];
    triggerTempBgAnimation(itemBgPath, 3000);
  }

  function triggerItemFailAnimation(itemId) {
    const charId = selectedCharId;

    const failBgPath = charConfig.itemFails[itemId];
    triggerTempBgAnimation(failBgPath, 3000);

  function triggerActionAnimation(actionType) {
    if (sleepinessVal >= 130) return;
    const charId = selectedCharId;
    const charConfig = IMAGE_CONFIG[charId];
    if (!charConfig || !charConfig.actions) return;

    const actionBgPath = charConfig.actions[actionType];
    triggerTempBgAnimation(actionBgPath, 3000);
  }

  function resetTempBgState() {
    if (tempBgTimer) {
      clearTimeout(tempBgTimer);
      tempBgTimer = null;
    }
    if (coolDownTimer) {
      clearTimeout(coolDownTimer);
      coolDownTimer = null;
    }
    isShowingTempBg = false;
    isCoolingDown = false;

    document.getElementById('quick-items-bar').classList.remove('disabled-controls');
    document.getElementById('right-actions-bar').classList.remove('disabled-controls');
    document.getElementById('dialogue-box-el').classList.remove('disabled-dialogue');
  }

  function getRandomAsleepQuote(char) {
    return getRandomElement(char.asleepQuotes || ["……"]);
  }

  function triggerSleepStageDialogue(isInitial = false) {
    if (suspicionVal >= 100) return;
    if (isCoolingDown && !isInitial) return;

    const char = characters.find(c => c.id === selectedCharId);
    if (!char) return;

    lastEvent = { type: 'dialogue', detail: 'click', success: true };

    if (!isInitial) triggerCoolDown();

    processInteractionIncrease();

    const stage = getSleepStage();

    if (stage === 'asleep') {
      document.getElementById('dialogue-text').innerText = getRandomAsleepQuote(char);
    } else if (isSuspiciousNow) {
      document.getElementById('dialogue-text').innerText = getRandomElement(char.suspiciousQuotes);
    } else {
      const quotesList = (sleepinessVal > 130 && char.sleepStageQuotes['heavy']) ? char.sleepStageQuotes['heavy'] : (char.sleepStageQuotes[stage] || char.sleepStageQuotes['normal']);
      document.getElementById('dialogue-text').innerText = getRandomElement(quotesList);
    }
  }

  function processInteractionIncrease() {
    if (activeSleepinessBuff > 0 && sleepinessVal < MAX_SLEEPINESS) {
      sleepinessVal = Math.min(MAX_SLEEPINESS, sleepinessVal + activeSleepinessBuff);
    }
    
    if (sleepinessVal >= 100) {
      suspicionVal = Math.max(0, suspicionVal - 5);
    }

    updateStatusDisplay();
    checkGameState();
  }

  function useItem(itemId) {
    if (suspicionVal >= 100 || isCoolingDown) return;
    if (!inventory.includes(itemId)) return;

    const char = characters.find(c => c.id === selectedCharId);
    const item = shopItems.find(x => x.id === itemId);
    if (!item || !char) return;

    const currentDynamicRate = calculateItemSuccessRate(itemId);
    const isItemSuccess = (itemId === 2) ? true : ((Math.random() * 100) <= currentDynamicRate);
    
    lastEvent = { type: 'item', detail: itemId, success: isItemSuccess };

    triggerCoolDown();

    if (getSleepStage() === 'asleep') {
      document.getElementById('dialogue-text').innerText = getRandomAsleepQuote(char);
      updateStatusDisplay();
      return;
    }

    if (isItemSuccess) {
      triggerItemAnimation(itemId);

      if (sleepinessVal < 100) {
        suspicionVal = Math.max(0, Math.min(100, suspicionVal + 10 + item.suspAdd));
      } else {
        suspicionVal = Math.max(0, suspicionVal - 5);
      }
      activeSleepinessBuff += item.tickAdd;

      checkSuspicionTrigger();

      if (getSleepStage() === 'asleep') {
        document.getElementById('dialogue-text').innerText = getRandomAsleepQuote(char);
      } else {
        document.getElementById('dialogue-text').innerText = getRandomElement(char.itemQuotes || ["……"]);
      }
    } else {
      triggerItemFailAnimation(itemId);

      if (sleepinessVal < 100) {
        suspicionVal = Math.max(0, Math.min(100, suspicionVal + 8));
      } else {
        suspicionVal = Math.max(0, suspicionVal - 5);
      }
      checkSuspicionTrigger();

      if (isSuspiciousNow && char.suspicionFailQuotes) {
        document.getElementById('dialogue-text').innerText = getRandomElement(char.suspicionFailQuotes);
      } else {
        document.getElementById('dialogue-text').innerText = getRandomElement(char.itemFailQuotes || ["……？"]);
      }
    }

    updateStatusDisplay();
    checkGameState();
  }

  function handleDialogue(type) {
    if (suspicionVal >= 100 || isCoolingDown) return;

    const char = characters.find(c => c.id === selectedCharId);

    lastEvent = { type: 'action', detail: type, success: true };

    triggerCoolDown();

    if (getSleepStage() === 'asleep') {
      document.getElementById('dialogue-text').innerText = getRandomAsleepQuote(char);
      updateStatusDisplay();
      return;
    }

    triggerActionAnimation(type);

    let replyText = "";
    let sDelta = 10;
    const currentStage = getSleepStage();

    if (isSuspiciousNow) {
      if (type === 'deny') {
        sDelta = -20; 
        isSuspiciousNow = false; 
        const denyQuotes = (sleepinessVal > 130 && char.actions.deny['heavy']) ? char.actions.deny['heavy'] : char.actions.deny[currentStage];
        replyText = Array.isArray(denyQuotes) ? getRandomElement(denyQuotes) : denyQuotes;
      } else {
        sDelta = 25; 
        const susFailQuotes = char.suspicionFailQuotes;
        replyText = Array.isArray(susFailQuotes) ? getRandomElement(susFailQuotes) : "……？";
      }
    } else {
      const stageActionQuotes = (sleepinessVal > 130 && char.actions[type]['heavy']) ? char.actions[type]['heavy'] : (char.actions[type][currentStage] || char.actions[type]['normal']);
      replyText = Array.isArray(stageActionQuotes) ? getRandomElement(stageActionQuotes) : stageActionQuotes;

      if (type === 'deny') sDelta = 5;
      else if (type === 'affirm') sDelta = 10;
      else if (type === 'tease') sDelta = 12;
      else if (type === 'topic') sDelta = 8;
    }

    if (sleepinessVal < 100) {
      suspicionVal = Math.min(100, Math.max(0, suspicionVal + sDelta));
    } else {
      suspicionVal = Math.max(0, suspicionVal - 5);
    }

    processInteractionIncrease();

    if (sleepinessVal < 100 && (type !== 'deny' || isSuspiciousNow)) {
      checkSuspicionTrigger();
    }

    const stage = getSleepStage();
    if (stage === 'asleep') {
      replyText = getRandomAsleepQuote(char);
    }

    document.getElementById('dialogue-text').innerText = replyText;

    checkGameState();
  }

  function updateStatusDisplay() {
    let displaySleep = Math.round(sleepinessVal);
    document.getElementById('val-sleepiness').innerText = displaySleep + '/' + MAX_SLEEPINESS;
    document.getElementById('bar-sleepiness').style.width = (displaySleep / MAX_SLEEPINESS * 100) + '%';

    document.getElementById('val-suspicion').innerText = suspicionVal + '%';
    document.getElementById('bar-suspicion').style.width = suspicionVal + '%';

    document.getElementById('val-favor').innerText = favorVal + '%';
    document.getElementById('bar-favor').style.width = favorVal + '%';

    renderQuickItemsBar();

    const bedroomBtn = document.getElementById('bedroom-btn-el');
    if (sleepinessVal >= MAX_SLEEPINESS) {
      bedroomBtn.style.display = 'block';
    } else {
      bedroomBtn.style.display = 'none';
    }

    if (!isShowingTempBg) {
      const stage = getSleepStage();
      const badgeEl = document.getElementById('speaker-status-badge');
      badgeEl.innerText = getSleepStageBadgeText(stage);

      if (sleepinessVal < 100) badgeEl.style.color = '#38bdf8';
      else if (sleepinessVal < 160) badgeEl.style.color = '#facc15';
      else if (sleepinessVal < 200) badgeEl.style.color = '#f43f5e';
      else badgeEl.style.color = '#e11d48';

      updateBackgroundForStage(stage);
    }
  }

  function moveToBedroom() {
    if (!isRewardClaimed) {
      coins += 250;
      document.getElementById('coin-count').innerText = coins;
      isRewardClaimed = true;
    }
    exitInteraction();
  }

  function checkGameState() {
    if (suspicionVal >= 100) {
      const screen = document.getElementById('interaction-screen');
      
      screen.style.backgroundColor = '#000000';
      tryLoadImage(FAIL_CG_PATH, (success, path) => {
        if (success) {
          screen.style.backgroundImage = `url('${path}')`;
        } else {
          screen.style.backgroundImage = 'none';
        }
      });

      document.getElementById('main-interactive-area-el').style.display = 'none';
      
      const dialogueBox = document.getElementById('dialogue-box-el');
      dialogueBox.style.display = 'block';

      document.getElementById('speaker-name-display').innerText = "凯尔希";
      document.getElementById('dialogue-text').innerText = "凯尔希发现了你的阴谋。";

      dialogueBox.classList.add('disabled-dialogue');
      dialogueBox.style.cursor = 'not-allowed';
      dialogueBox.onclick = null;
    }
  }

  function exitInteraction() {
    resetTempBgState();
    const screen = document.getElementById('interaction-screen');
    screen.style.backgroundColor = 'transparent';
    screen.style.display = 'none';
  }

  renderCharacterList();
  renderShop();
  renderConfig();
</script>

</body>
</html>
